name: Deploy The Evolving Firm
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'src/**', 'tests/**', 'organization/roles/**', 'cases/active/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check web/src/app.js
          node --check web/serve.mjs
          node --check web/src/case.js
          node --check web/src/cases.js
          node --check web/src/workflow.js
          node --check web/src/evolution.js
          node --check web/src/proposal-v2.js
      - name: Check synthetic evidence
        run: |
          python3 scripts/check_f03.py
          python3 scripts/check_versions.py
          python3 scripts/check_f03_v2.py
          python3 -m unittest discover -s tests -v
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp -R web/src web/evidence _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
